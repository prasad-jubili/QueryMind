spring.application.name=querymind

# Database configuration (environment variables with local defaults)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/querymind}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=org.postgresql.Driver

# Flyway migration settings
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# Server configuration
server.port=${PORT:8080}

# Query Execution Safety Limits
querymind.execution.max-rows=${MAX_ROWS:100}
querymind.execution.query-timeout-seconds=${QUERY_TIMEOUT_SECONDS:5}
